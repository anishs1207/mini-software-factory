name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check factory scripts and tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash agents/ci-check.sh
      - uses: hashicorp/setup-terraform@v3
      - name: Check Terraform configuration
        run: |
          terraform -chdir=infra fmt -check
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate -no-color
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/briefing-product/package-lock.json
      - name: Check briefing product
        run: bash examples/briefing-product/product-check.sh
